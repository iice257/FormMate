services:
  formmate:
    build:
      context: .
      target: dev
    env_file:
      - .env.local
    environment:
      NODE_ENV: development
      VITE_DEV_HOST: 0.0.0.0
      FORMMATE_API_BIND_HOST: 0.0.0.0
      FORMMATE_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000
      VITE_API_PROXY_TARGET: http://127.0.0.1:3000
    ports:
      - "5173:5173"
      - "3000:3000"
    volumes:
      - .:/app
      - formmate_node_modules:/app/node_modules
      - formmate_vite_cache:/app/.vite-cache
    command: npm run dev:stack

  formmate-prod:
    profiles:
      - prod
    build:
      context: .
      target: production
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      FORMMATE_DOCKER_HOST: 0.0.0.0
      FORMMATE_DOCKER_PORT: 8080
      FORMMATE_ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    ports:
      - "8080:8080"

volumes:
  formmate_node_modules:
  formmate_vite_cache:
