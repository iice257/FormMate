<!doctype html>
<html>
  <head>
    <title>Multi Step Intake</title>
  </head>
  <body>
    <form>
      <fieldset>
        <legend>Basic Details</legend>
        <label for="first-name">First Name</label>
        <input id="first-name" name="first_name" type="text" required />
      </fieldset>

      <section hidden>
        <label for="hidden-salary">Salary Expectation</label>
        <input id="hidden-salary" name="salary" type="text" />
      </section>

      <button type="button">Next Step</button>
    </form>
  </body>
</html>
